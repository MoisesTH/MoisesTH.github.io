name: Desplegar sitio web en GitHub Pages

on:
  push:
    branches:
      - main

# Permisos requeridos para desplegar con GitHub Actions en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite cancelar ejecuciones simultáneas anteriores
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar versión de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Iniciar e instalar dependencias
        run: npm ci || npm install

      - name: Compilar aplicación React + Vite
        run: npm run build

      - name: Subir artefactos de la compilación
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
