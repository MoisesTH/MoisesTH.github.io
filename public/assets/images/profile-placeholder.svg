<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
  </g>

  <!-- Abstract Tech & Cognitive Data Graphics -->
  <circle cx="200" cy="160" r="70" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6 6" />
  
  <!-- User Silhouette Graphic -->
  <path d="M200 125 C 180 125, 165 140, 165 160 C 165 180, 180 195, 200 195 C 220 195, 235 180, 235 160 C 235 140, 220 125, 200 125 Z M 130 270 C 130 220, 160 210, 200 210 C 240 210, 270 220, 270 270 Z" fill="#E2E8F0" opacity="0.9"/>
  
  <!-- Code / Math symbols floating -->
  <text x="50" y="110" font-family="monospace" font-size="18" fill="#38BDF8" opacity="0.8">&lt;Python /&gt;</text>
  <text x="270" y="110" font-family="sans-serif" font-size="18" fill="#34D399" opacity="0.8">P(θ|D)</text>
  <text x="50" y="320" font-family="sans-serif" font-size="16" fill="#818CF8" opacity="0.8">CTB Task</text>
  <text x="270" y="320" font-family="monospace" font-size="16" fill="#F43F5E" opacity="0.8">def fit_mcmc():</text>

  <!-- Outer Ring Highlight -->
  <circle cx="200" cy="160" r="90" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.3" />
</svg>
